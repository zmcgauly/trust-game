<div class="round-summary-hover">
  <span class="round-summary-trigger" tabindex="0">Round review</span>
  <div class="round-summary-popover">
    <p><b>Round review</b></p>
    <p>Points the proposer sent: {{ summary_offer }}</p>
    <p>Points the responder sent back: {{ summary_delivered_return }}</p>
    <p>{{ summary_received_label }}: {{ summary_received_amount }}</p>
    <p>Your final payoff for this round: {{ summary_payoff }}</p>
  </div>
</div>
