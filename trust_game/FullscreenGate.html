{{ if show_fullscreen_gate }}
<div class="fullscreen-gate" data-fullscreen-gate>
  <div class="fullscreen-gate-panel">
    <h3>Full Screen Required</h3>
    <p>Please enter full screen to continue.</p>
    <button class="fullscreen-gate-button" type="button" data-fullscreen-enter>Enter full screen</button>
  </div>
</div>
<script>
(function () {
  var gate = document.querySelector('[data-fullscreen-gate]');
  var button = document.querySelector('[data-fullscreen-enter]');
  if (!gate || !button) return;

  function fullscreenElement(doc) {
    return doc.fullscreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;
  }

  function viewportLooksFullscreen(win) {
    var widthGap = Math.abs(win.screen.availWidth - win.innerWidth);
    var heightGap = Math.abs(win.screen.availHeight - win.innerHeight);
    return widthGap <= 8 && heightGap <= 90;
  }

  function parentIsFullscreen() {
    try {
      return window.parent && window.parent !== window && !!fullscreenElement(window.parent.document);
    } catch (error) {
      return false;
    }
  }

  function experimentFullscreen() {
    return !!fullscreenElement(document) || parentIsFullscreen() || viewportLooksFullscreen(window.top || window);
  }

  function updateGate() {
    gate.hidden = experimentFullscreen();
  }

  function requestFullscreen() {
    var targetDocument = document;
    try {
      if (window.parent && window.parent !== window) {
        targetDocument = window.parent.document;
      }
    } catch (error) {
      targetDocument = document;
    }
    var target = targetDocument.documentElement;
    var request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
    if (!request) {
      updateGate();
      return;
    }
    Promise.resolve(request.call(target)).then(updateGate).catch(function () {
      gate.hidden = false;
    });
  }

  button.addEventListener('click', requestFullscreen);
  document.addEventListener('submit', function (event) {
    if (!experimentFullscreen()) {
      event.preventDefault();
      gate.hidden = false;
      button.focus();
    }
  }, true);
  document.addEventListener('fullscreenchange', updateGate);
  document.addEventListener('webkitfullscreenchange', updateGate);
  document.addEventListener('MSFullscreenChange', updateGate);
  window.addEventListener('resize', updateGate);
  window.setInterval(updateGate, 500);
  updateGate();
})();
</script>
{{ endif }}
